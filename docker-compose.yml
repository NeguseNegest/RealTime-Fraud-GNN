services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: fraud-gnn-mlflow
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --host 0.0.0.0 --port 5000
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow_data:/mlflow

volumes:
  mlflow_data: